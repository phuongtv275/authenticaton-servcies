spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Route 1: /identity/** → identity-service (port 8080)
            # StripPrefix=1 loại bỏ /identity trước khi forward
            # Ví dụ: /identity/api/v1/auth/login → /api/v1/auth/login
            - id: identity-service-route
              uri: http://localhost:8080
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1

            # Route 2: /product/** → product-service (port 8082)
            # Ví dụ: /product/api/products → /api/products
            - id: product-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1

server:
  port: 8888

# JWT config — copy từ identity-service để Gateway tự validate token
jwt:
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Danh sách các path được bỏ qua kiểm tra JWT (whitelist)
  # AntPath pattern: /identity/api/v1/auth/** bao gồm /login, /register
  whitelist-paths:
    - /identity/api/v1/auth/**
    - /identity/api/auth/**

logging:
  level:
    com.example.apigateway: DEBUG